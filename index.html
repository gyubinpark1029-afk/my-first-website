<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 번째 웹사이트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #333;
    }
    .card {
      width: 100%;
      max-width: 480px;
      padding: 40px 28px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 1.8rem; margin-bottom: 12px; }
    p { line-height: 1.6; color: #666; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 12px 28px;
      color: #fff;
      text-decoration: none;
      background: #667eea;
      border-radius: 999px;
    }
    @media (max-width: 480px) {
      .card { padding: 32px 20px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>👋 안녕하세요!</h1>
    <p>나의 첫 번째 웹사이트에 오신 것을 환영합니다.<br>GitHub Pages로 배포된 간단한 랜딩페이지입니다.</p>
    <a href="https://github.com/gyubinpark1029-afk/my-first-website">GitHub 저장소 보기</a>
  </main>
</body>
</html>
